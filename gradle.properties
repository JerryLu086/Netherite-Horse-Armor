# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.daemon = false
org.gradle.debug = false

# Out of memory. Java heap space. Hell yeah gradle.
org.gradle.jvmargs = -Xmx4g

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21, 1.22)
neo_version = 21.1.209
neo_version_range = [21.1,)
neo_gradle_version = 2.0.107
loader_version_range = [1,)

parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Mod Properties
mod_id = netherite_horse_armor
mod_name = Netherite Horse Armor
mod_license = MIT License
mod_version = 1.21.1-2.0
mod_group_id = com.jerrylu086.netherite_horse_armor
mod_authors = JerryLu086
mod_description = A new horse armor for you to collect!
archives_base_name = netherite_horse_armor-neoforge