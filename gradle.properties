# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.daemon = false
org.gradle.debug = false

# Out of memory. Java heap space. Hell yeah gradle.
org.gradle.jvmargs=-Xmx4g

# Dependencies
minecraft_version = 1.20.5
minecraft_version_range = [1.20.5,1.21)
neo_version = 20.5.21-beta
neo_version_range = [20.5,)
loader_version_range = [2,)

neogradle.subsystems.parchment.minecraftVersion = 1.20.4
neogradle.subsystems.parchment.mappingsVersion = 2024.04.14

# Mod Properties
mod_id = netherite_horse_armor
mod_name = Netherite Horse Armor
mod_license = MIT License
mod_version = 1.20.5+-beta-1.0.5a
mod_group_id = com.jerrylu086.netherite_horse_armor
mod_authors = JerryLu086
mod_description = A new horse armor for you to collect!